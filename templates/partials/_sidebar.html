<aside class="hidden md:flex flex-col h-screen w-64 fixed left-0 top-0 bg-slate-900/80 backdrop-blur-lg border-r border-emerald-500/5 shadow-2xl shadow-black/50 z-40">
  <div class="px-6 py-8">
    <div class="flex items-center gap-3 mb-1">
      <span class="material-symbols-outlined text-emerald-400 text-3xl" style="font-variation-settings: 'FILL' 1;">shield</span>
      <h1 class="text-emerald-400 font-bold font-headline text-lg">The Vault</h1>
    </div>
    <p class="font-inter font-medium tracking-wide uppercase text-[10px] text-slate-500 ml-10">Military Grade Encryption</p>
  </div>
  <nav class="flex-1 px-4 space-y-2">
    <a class="{% if active_nav | default('') == 'vault' %}bg-emerald-500/10 text-emerald-400 border-r-2 border-emerald-400{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-emerald-300{% endif %} px-4 py-3 flex items-center gap-3 transition-all duration-200" href="/vault">
      <span class="material-symbols-outlined">inventory_2</span>
      <span class="font-inter font-medium tracking-wide uppercase text-xs">All Items</span>
    </a>
    {% for item in [
      ('description', 'Secure Notes'),
      ('credit_card', 'Payment Cards'),
      ('verified_user', 'Security Audit'),
      ('delete', 'Trash'),
    ] %}
    <span class="text-slate-600 px-4 py-3 flex items-center gap-3 cursor-not-allowed opacity-60">
      <span class="material-symbols-outlined">{{ item[0] }}</span>
      <span class="font-inter font-medium tracking-wide uppercase text-xs flex-1">{{ item[1] }}</span>
      <span class="text-[9px] font-bold uppercase tracking-wider text-slate-500 bg-slate-800/60 px-2 py-0.5 rounded">Soon</span>
    </span>
    {% endfor %}
  </nav>
  <div class="px-6 py-4">
    <a class="block text-center w-full py-3 px-4 primary-gradient text-on-primary font-bold rounded-md shadow-lg shadow-emerald-950/20 active:scale-95 transition-transform text-xs uppercase tracking-widest" href="/vault/new">
      Add Credential
    </a>
  </div>
</aside>
